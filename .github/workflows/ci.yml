name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-macos:
    name: Test (macOS, full)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race -count=1 ./...

  test-no-brew:
    # The core package must not depend on Homebrew being installed.
    name: Test core package (Linux, no Homebrew)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./pkg/...
      - run: go test -race -count=1 ./pkg/...

  lint:
    name: Lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          # Report only issues in changed code, so existing findings in the
          # GUI can be fixed step by step without blocking every PR.
          only-new-issues: true
